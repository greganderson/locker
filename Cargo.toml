[package]
name = "locker"
version = "0.1.0"
edition = "2021"
description = "A fake lock screen: fullscreen image that dismisses on a secret code"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
fontdue = "0.9"
chrono = "0.4"
libc = "0.2"

[profile.release]
lto = true
strip = true
